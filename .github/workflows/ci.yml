name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          # Dummy values — the build never connects, it only needs them defined.
          MONGODB_URI: mongodb://localhost:27017/voca
          NEXTAUTH_SECRET: ci-dummy-secret-not-used
          NEXTAUTH_URL: http://localhost:3000
          NVIDIA_API_KEY: nvapi-ci-dummy-not-used
